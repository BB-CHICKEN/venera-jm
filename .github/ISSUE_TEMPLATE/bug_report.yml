name: Bug 报告
description: 报告插件使用中遇到的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提交 Bug 报告！提交前请确认：
        - 已阅读 [README](https://github.com/BB-CHICKEN/venera-jm#readme) 中的说明
        - 搜索过已有 Issue，确认没有重复
        - 提供的信息越详细，问题解决越快

  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 你使用的插件版本号
      placeholder: 如 1.8.2
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App 版本
      description: 你使用的 Venera App 版本号
      placeholder: 如 1.5.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述遇到的问题
      placeholder: 描述你遇到了什么问题...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请一步步描述如何触发该问题
      placeholder: |
        1. 打开 App
        2. 点击 xxx
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么
      placeholder: 正常应该显示...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / 截图
      description: 粘贴相关错误日志或截图链接
      placeholder: 如有日志请粘贴在这里...
    validations:
      required: false

  - type: dropdown
    id: network
    attributes:
      label: 网络环境
      description: 你的网络环境
      options:
        - 直连（无代理）
        - 使用代理/魔法
        - 不确定
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认使用的是最新版插件
          required: true
        - label: 我已搜索过已有 Issue，确认无重复
          required: true