name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！提交前请确认：
        - 搜索过已有 Issue，确认没有重复建议
        - 建议与禁漫天堂插件相关（非 App 本身功能）

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 请描述你遇到的使用场景或痛点
      placeholder: 当我想做 xxx 时，发现无法实现...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望这个功能如何工作
      placeholder: 建议在 xxx 位置添加 xxx 功能...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 如果有其他实现思路，请描述
      placeholder: 也可以考虑用 xxx 方式...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 其他任何相关信息或截图
      placeholder: 其他补充...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认无重复
          required: true
        - label: 此建议与禁漫天堂插件相关，非 Venera App 本身
          required: true