name: 自动发布

on:
  push:
    branches:
      - main
    paths:
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          version=$(node -e "console.log(require('./index.json')[0].version)")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 生成 Release Body
        run: |
          node -e "
          const data = require('./index.json');
          const fs = require('fs');
          const notes = data[0].description || '';
          const body = notes + '\n\n---\n\n**订阅链接**\n- Release: \`https://github.com/BB-CHICKEN/venera-jm/releases/latest/download/recode-jm.js\`\n- 直连: \`https://raw.githubusercontent.com/BB-CHICKEN/venera-jm/refs/heads/main/recode-jm.js\`\n- 镜像: \`https://ghfast.top/https://raw.githubusercontent.com/BB-CHICKEN/venera-jm/main/recode-jm.js\`';
          fs.writeFileSync('release_body.md', body);
          "

      - name: 发布 Release（推送即自动创建/更新对应版本）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: recode-jm.js
          replace_assets: true
          draft: false
          prerelease: false